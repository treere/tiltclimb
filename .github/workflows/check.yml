name: check

# Every push and every pull request goes through typecheck, Biome, contrast checks and build.
# It publishes nothing: it exists to know right away whether the code is in order.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, contrast and build
        run: npm run check
