<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1116" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tiltclimb</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1116;
        color: #e6edf3;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #scaffold-note {
        position: fixed;
        inset: auto 0 0 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: #161b22cc;
        font-size: 12px;
        color: #8b98a8;
      }
      #scaffold-note strong {
        color: #e6edf3;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="scaffold-note">
      <strong>Tiltclimb</strong>
      <span>scaffold pronto · nessun gameplay ancora</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
