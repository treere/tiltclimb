<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1116" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tiltclimb</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1116;
        color: #e6edf3;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Portrait only: rotating swaps the tilt axes and invalidates the input mapping. */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        place-content: center;
        text-align: center;
        padding: 24px;
        background: #0e1116;
        color: #8b98a8;
      }
      @media (orientation: landscape) and (max-height: 520px) {
        #rotate-hint {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="rotate-hint">Ruota il telefono in verticale: si sterza inclinando il lato corto.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
