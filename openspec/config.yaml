schema: spec-driven

context: |
  Tiltclimb is a 2D browser game: endless vertical scrolling (the player climbs),
  you steer by tilting the phone left/right. It must run on Android Chrome
  on a phone and on desktop with the keyboard; no native app, no account, no backend.
  Fixed stack: Excalibur 1.0.1, TypeScript, Vite 8. No additional UI dependencies.
  The tilt input uses the browser APIs (deviceorientation, gamma) because Excalibur has
  no sensor support; a fallback without sensors is always required (keyboard on desktop,
  drag on touch).
  The player is Andrea: tech lead, light conversational tone, no unrequested documents.
  OpenSpec artifacts are in English; identifiers, comments and keys in the code are in
  English.
  Phone preview only through a cloudflared quick tunnel (HTTPS mandatory for the sensors),
  so the dev server must accept .trycloudflare.com hosts and HMR on wss:443.
  No external graphic asset in the first iteration: shapes drawn in code.

rules:
  proposal:
    - Write in English, max 400 words
    - Always state what is out of scope
  design:
    - Document the game constants (gravity, climb speed, tilt sensitivity, dead zone) with their initial values
    - Explain the tilt math (gamma, zero calibration, smoothing) and why the fallback exists
  tasks:
    - Every task must have an executable check (npm run check, or a test on the phone)
    - Tasks of at most 30 minutes each
    - The standard gate for every task is `npm run check`: typecheck + Biome (lint and format) + build

operations:
  apply:
    guidance:
      - Keep the game playable after every task, not only at the end
      - Verify with npm run build before declaring a task closed
  archive:
    guidance:
      - Sync the spec deltas before archiving
